[workspace]
name = "advstats"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
# ── Core Python & Notebooks ──────────────────────────────
python = ">=3.11,<3.13"
pip = "*"
jupyter = "*"
jupyterlab = "*"
ipykernel = "*"
marimo = ">=0.25"                     # pixi sandbox support requires 0.25+

# ── Data Manipulation ────────────────────────────────────
pandas = ">=2.0"
polars = ">=0.20"
numpy = ">=1.26"

# ── Statistics ───────────────────────────────────────────
scipy = ">=1.12"
statsmodels = ">=0.14"
pingouin = "*"                        # easy statistical tests
scikit-learn = "*"                    # ML & model diagnostics

# ── Visualization ────────────────────────────────────────
matplotlib = "*"
seaborn = "*"
altair = "*"
plotly = "*"                          # interactive plots

# ── Data Science Extras ──────────────────────────────────
xarray = "*"                          # labeled multi-dim arrays
pymc = "*"                            # Bayesian modeling
lifelines = "*"                       # survival analysis
sympy = "*"                           # symbolic math

